name: Blue post tracker

on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test_post:
        description: "Send the newest matching post as a test (doesn't change state)"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job commit state.json

concurrency:
  group: blue-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check feed and post new blue posts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAMES: ${{ vars.GAMES }}
          REGIONS: ${{ vars.REGIONS || 'us' }}
          TEST_POST: ${{ inputs.test_post && '1' || '' }}
        run: python3 tracker.py

      - name: Save seen posts
        if: ${{ !inputs.test_post }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update seen blue posts"
            git push
          fi
